spring.application.name=websiteElectronics

spring.datasource.url=jdbc:mysql://localhost:3306/electronics_websites_db
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Invoice configuration
invoice.folder.path=D:/websiteElectronics/invoices

# Order configuration
report.folder.path=D:/websiteElectronics/reports

# ============================================
# GOOGLE OAUTH2
# ============================================
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=
spring.security.oauth2.client.registration.google.redirect-uri=

# ============================================
# JWT Configuration
# ============================================
jwt.secret=
jwt.expiration=86400000

# ==========================================
# ChatBot
# ==========================================
gemini.api.key=
gemini.api.url=

# ============================================
# OAuth2 Authorization Server
# ============================================
# Issuer URL - Authorization Server
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080

# Logging cho OAuth2
logging.level.org.springframework.security.oauth2=DEBUG
